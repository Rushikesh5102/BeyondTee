version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beyondtee-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/beyondtee
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=changeme_in_prod
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: beyondtee-mongo
    restart: always
    ports:
      - "27017:27017" # Expose for local testing, remove in prod if not needed
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
